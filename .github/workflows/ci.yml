name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * *'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    container: gcc:16
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake meson ninja-build python3 libx11-dev libxcb1-dev libxrandr-dev
      - name: Update to the latest Vulkan-Headers release
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          version=$(git ls-remote --tags --refs https://github.com/KhronosGroup/Vulkan-Headers.git | sed -n 's#.*refs/tags/v\([0-9]*\.[0-9]*\.[0-9]*\)$#\1#p' | sort -V | tail -1)
          git -C external/Vulkan-Headers fetch --depth 1 origin tag "v$version"
          git -C external/Vulkan-Headers checkout "v$version"
          python3 scripts/gen_vk_init.py
      - name: Check generated files
        run: python3 scripts/gen_vk_init.py --check
      - name: CMake
        if: ${{ !cancelled() }}
        run: |
          cmake -S . -B build-cmake -DVULKAN_INITIALIZERS_TEST=ON
          cmake --build build-cmake --parallel $(nproc)
          ctest --test-dir build-cmake --output-on-failure
      - name: Meson
        if: ${{ !cancelled() }}
        run: |
          meson setup build-meson -Dtests=true
          meson test -C build-meson --print-errorlogs
      - name: Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cat VERSION)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git commit -qam "Update to Vulkan-Headers $version"
            git push origin HEAD:master
          fi
          if ! git ls-remote --exit-code --tags origin "v$version" >/dev/null; then
            apt-get install -y --no-install-recommends gh
            gh release create "v$version" --repo "$GITHUB_REPOSITORY" --target "$(git rev-parse HEAD)" \
              --title "v$version" --notes "Generated from Vulkan-Headers v$version."
          fi
